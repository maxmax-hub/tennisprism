<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TennisPrism · 视频复盘与训练</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="#top"><span class="brand-mark">↗</span>Tennis<span>Prism</span></a><a class="example-link" href="report.json" download>保存分析 ↓</a></header>
<main id="top"><div class="intro"><div class="eyebrow">REVIEW INTO PRACTICE</div><h1>把这一拍，变成下一次进步。</h1><p id="subtitle"></p></div>
<div class="workspace report-workspace"><section id="review"><div class="intake-card video-card"><div class="video-stage"><video id="video" src="preview.mp4" controls playsinline preload="metadata"></video><canvas id="overlay" aria-label="真实模型预测的人体骨架"></canvas></div><div class="review-controls"><button id="prev" class="text-button">← 上一帧</button><span id="clock"></span><button id="next" class="text-button">下一帧 →</button><label>慢放 <select id="speed"><option value="1">1×</option><option value="0.5">0.5×</option><option value="0.25">0.25×</option></select></label></div><div class="review-options"><label><input type="checkbox" id="skeleton"> 人体骨架</label><label><input type="checkbox" id="zoom"> 跟随放大</label><span id="frame-label"></span></div><p id="pose-note" class="small-note"></p></div>
<div class="moment"><div><span class="step-label" id="moment-time"></span><h2 id="moment-title">从关键动作开始回看</h2><p id="moment-caption"></p><button class="text-button" id="loop">循环看这一段</button></div><div id="zoom-box" hidden><canvas id="zoom-canvas" width="320" height="240" aria-label="跟随所选球员的局部放大"></canvas></div></div><div id="keyframes" class="keyframes"></div></section>
<aside class="intake-card"><span class="step-label" id="player"></span><div class="rating" id="rating"></div><span class="confidence" id="rating-confidence"></span><p class="small-note">NTRP 视频估计 · 非官方评级</p><h2>本次复盘</h2><p id="summary"></p><div id="findings"></div><a class="primary" href="#training">看看下一次怎么练 ↓</a><details class="report-details"><summary>等级依据与未观察项目</summary><p id="basis"></p><ul id="not-observed"></ul></details></aside></div>
<section id="training" class="training-section"><span class="step-label">NEXT SESSION</span><h2>下一次上场，就这样练。</h2><p class="small-note">潜在问题可以先试练；用回球与后续录像判断调整是否适合你。</p><div id="drills"></div></section>
<details class="report-details"><summary>查看画面依据、采样范围与方法说明</summary><div id="evidence-list"></div><ul id="limits"></ul><p id="provenance" class="small-note"></p></details>
<footer><span>TennisPrism · 复盘 / 训练 / 再验证</span><span>视频与页面保存在本地</span></footer></main><script src="data.js"></script><script src="app.js"></script></body></html>
